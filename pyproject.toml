[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weyland-yutani-dashboard-api"
version = "0.1.0"
description = "Analytics and PDF reporting API for the Weyland-Yutani dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "reportlab>=4.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
generator = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]
